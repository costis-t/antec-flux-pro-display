name: Rust

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Build
        run: cargo build --locked --release --all-features

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-features -- -D warnings

      - name: Clippy (feature subsets)
        run: |
          for f in "" nvidia amd intel amd,intel; do
            cargo clippy --locked --no-default-features ${f:+--features $f} -- -D warnings
          done
