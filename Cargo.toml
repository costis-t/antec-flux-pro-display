[package]
name = "antec-flux-pro-display"
description = "Display the temperature of the CPU and GPU on the Antec Flux Pro display"
version = "0.1.3"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/costis-t/antec-flux-pro-display"
readme = "README.md"
authors = [
    "Nish Tahir <nishtahir@outlook.com>",
    "Anthony Batchelor <tony@ynottony.net>",
]

[features]
# All three backends are on by default: `amd` and `intel` are pure sysfs and
# pull in no dependencies, and `nvidia` only dlopens libnvidia-ml.so.1 at
# runtime, so enabling them costs nothing at build time on any host. Without
# this, `cargo deb` and a stock `cargo build` produce a binary that is
# structurally incapable of reading an AMD or Intel GPU, and the failure
# surfaces as "Failed to get Nvidia GPU" -- which reads as a driver problem.
default = ["nvidia", "amd", "intel"]
nvidia = ["nvml-wrapper"]
amd = []
intel = []

[dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.35", features = ["derive"] }
ctrlc = { version = "3.4.7", features = ["termination"] }
nvml-wrapper = { version = "0.10.0", optional = true }
rusb = "0.9.4"
serde = "1.0.219"
serde_derive = "1.0.219"
shellexpand = "3.1.0"
toml = "0.8.20"

[package.metadata.deb]
maintainer = "Nish Tahir <nishtahir@outlook.com>"
copyright = "2024-2025, Nish Tahir <nishtahir@outlook.com>"
license-file = ["LICENSE", "4"]
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
    [
        "target/release/antec-flux-pro-display",
        "usr/bin/",
        "755",
    ],
    [
        "packaging/udev/70-antec-flux-pro-display.rules",
        "lib/udev/rules.d/",
        "644",
    ],
    [
        "packaging/systemd/antec-flux-pro-display.service",
        "lib/systemd/system/",
        "644",
    ],
]
maintainer-scripts = "packaging/debian/"
